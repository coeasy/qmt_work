# 提交即自动构建 Windows 桌面客户端（预览版 / Artifact）。
# 注意：正式发布安装包由 release.yml 在 GitHub Release 发布时构建并上传资产；
#       本工作流负责「每次 push 到 main 都产出一份可下载的客户端预览包」，便于快速验证。
name: Build Client

on:
  push:
    branches: [main]
  workflow_dispatch:

# 同一分支上取消正在运行的旧流水线，节省资源
concurrency:
  group: build-client-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # D5（2026-08-29 全链路计划）：前端质量门禁 —— lint(0 告警) + vitest + build 必跑
  frontend-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend-next/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend-next
        run: npm ci
        shell: bash

      # 旧 frontend/ 已退役：frontend-next 无 ESLint 配置，类型门禁由 tsc --noEmit 承担
      - name: Typecheck (tsc --noEmit)
        working-directory: frontend-next
        run: npm run typecheck
        shell: bash

      - name: Unit tests (vitest)
        working-directory: frontend-next
        run: npm test
        shell: bash

      - name: Build (vite)
        working-directory: frontend-next
        run: npm run build
        shell: bash

  # D5：后端基线 —— ruff + pytest（逐文件跑，规避 Windows 同进程全量硬崩溃；
  # 契约测试在无后端环境自动 skip，不算失败）
  # ★ 后端是 Windows-only 应用：测试用 Windows 路径（大小写不敏感）与 +08:00 时区，
  #   必须在 windows-latest + 中国时区跑，否则 test_broker_dedupe / test_autoconnect /
  #   test_clock_unity 等在 Linux/UTC 上必然失败。
  backend-checks:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set timezone to Asia/Shanghai (China Standard Time)
        run: tzutil /s "China Standard Time"
        shell: cmd
        continue-on-error: true

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend deps + ruff
        run: python -m pip install --upgrade pip && pip install -r backend/requirements.txt ruff
        shell: bash

      - name: Ruff
        working-directory: backend
        run: ruff check .
        shell: bash

      - name: Pytest (per-file)
        working-directory: backend
        run: |
          fail=0
          for f in tests/test_*.py; do
            python -m pytest "$f" -q -p no:cacheprovider || fail=1
          done
          exit $fail
        shell: bash

  build-windows:
    needs: [frontend-checks, backend-checks]
    runs-on: windows-latest
    env:
      # Windows runner 默认 cp1252 控制台：构建脚本打印中文（断言信息/进度日志）会
      # UnicodeEncodeError 崩溃。强制 utf-8。
      PYTHONIOENCODING: utf-8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend-next/package-lock.json

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller
        shell: bash

      - name: Install backend deps (incl. eltdx TDX data source)
        run: python -m pip install --upgrade pip && pip install -r backend/requirements.txt
        shell: bash

      - name: Install frontend dependencies
        working-directory: frontend-next
        run: npm ci
        shell: bash

      # 桥接运行时不入库（.gitignore），CI checkout 后必须现备，否则产物"看起来能装、
      # 桥接却 100% 起不来"。--with-deps 同时装齐桥接依赖闭包（cryptography/pydantic/
      # pydantic-settings/psutil），--strict 让下载失败直接炸而不是静默降级。
      - name: Prepare bridge runtimes
        working-directory: backend
        run: python tools/fetch_runtimes.py --only cp311 --with-deps --strict
        shell: bash

      - name: Build client (frontend + backend + electron)
        working-directory: frontend-next
        env:
          QMT_BUILD_REQUIRE_RUNTIMES: "1"
        # --publish never：本流水线只做构建校验 + upload-artifact，不发布 Release。
        #   electron-builder.yml 配了 publish(provider: github)，在 CI 里它会检测到
        #   发布意图并索要 GH_TOKEN——没给就在 zip 打包最后一步 exit 1
        #   （"GitHub Personal Access Token is not set"）。发布走 release.yml
        #   （-p always + GH_TOKEN），这里显式关掉。
        run: npm run build && npm run backend:build && npx electron-builder --win zip --publish never
        shell: bash

      - name: Verify desktop artifacts and generate SBOM manifest
        run: python scripts/verify_artifacts.py --require-client
        shell: bash

      # 产物真目录是 dist-electron（electron-builder.yml 的 directories.output）。
      # 此前写的是 frontend-next/release/* —— 该目录根本不存在，上传的 artifact
      # 一直是**空的**（2026-09-28 修：看得见流水线绿、下载不到包）。
      # 只传安装包/便携包/清单，不传 win-unpacked（几百 MB 且可直接由 zip 解开）。
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: qmt_work-client-${{ github.sha }}
          path: |
            frontend-next/dist-electron/*.exe
            frontend-next/dist-electron/*.zip
            frontend-next/dist-electron/latest.yml
            frontend-next/dist-electron/release-manifest.json
          retention-days: 14
          if-no-files-found: error
