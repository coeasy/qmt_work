# 提交即自动构建 Windows 桌面客户端（预览版 / Artifact）。
# 注意：正式发布安装包由 release.yml 在 GitHub Release 发布时构建并上传资产；
#       本工作流负责「每次 push 到 main 都产出一份可下载的客户端预览包」，便于快速验证。
name: Build Client

on:
  push:
    branches: [main]
  workflow_dispatch:

# 同一分支上取消正在运行的旧流水线，节省资源
concurrency:
  group: build-client-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # D5（2026-08-29 全链路计划）：前端质量门禁 —— lint(0 告警) + vitest + build 必跑
  frontend-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
        shell: bash

      - name: Lint (--max-warnings=0)
        working-directory: frontend
        run: npm run lint
        shell: bash

      - name: Unit tests (vitest)
        working-directory: frontend
        run: npm test
        shell: bash

      - name: Build (vite)
        working-directory: frontend
        run: npm run build
        shell: bash

  # D5：后端基线 —— ruff + pytest（逐文件跑，规避 Windows 同进程全量硬崩溃；
  # 契约测试在无后端环境自动 skip，不算失败）
  backend-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend deps + ruff
        run: python -m pip install --upgrade pip && pip install -r backend/requirements.txt ruff
        shell: bash

      - name: Ruff
        working-directory: backend
        run: ruff check .
        shell: bash

      - name: Pytest (per-file)
        working-directory: backend
        run: |
          fail=0
          for f in tests/test_*.py; do
            python -m pytest "$f" -q -p no:cacheprovider || fail=1
          done
          exit $fail
        shell: bash

  build-windows:
    needs: [frontend-checks, backend-checks]
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller
        shell: bash

      - name: Install backend deps (incl. eltdx TDX data source)
        run: python -m pip install --upgrade pip && pip install -r backend/requirements.txt
        shell: bash

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
        shell: bash

      - name: Build client (frontend + backend + electron)
        working-directory: frontend
        run: npm run dist:portable
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: qmt_work-client-${{ github.sha }}
          path: frontend/release/*
          retention-days: 14
