name: CI

on:
  push:
    branches: [main]
  pull_request:

# 取消同一分支上正在运行的旧流水线，节省资源
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests (pytest)
    # ★ 后端是 Windows-only 桌面应用（PyInstaller 打 Windows exe），测试用 Windows 路径
    #   （`P:\...`、大小写不敏感）与本地时区（+08:00）。在 ubuntu 上跑会因「`\` 非分隔符 /
    #   os.path.normcase 不降大小写 / 时区为 UTC」导致 test_broker_dedupe /
    #   test_autoconnect / test_clock_unity 等必然失败。必须在 windows-latest 上跑，
    #   且把本地时区设为中国时区，才能与开发机（win32 +08:00）一致。
    runs-on: windows-latest
    env:
      # Windows runner 默认 cp1252 控制台：Python 打印中文（断言信息/构建日志）会
      # UnicodeEncodeError 崩溃。强制 stdout/stderr 为 utf-8。
      PYTHONIOENCODING: utf-8
    defaults:
      run:
        working-directory: backend
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 本地时区设为「中国标准时间」（+08:00），使 parse_iso 等时区相关断言与开发机一致。
      - name: Set timezone to Asia/Shanghai (China Standard Time)
        run: tzutil /s "China Standard Time"
        shell: cmd
        continue-on-error: true

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 自动发现 tests/test_*.py 全部测试文件、逐文件运行：自动纳入新增测试，
      # 避免硬编码清单漏掉 test_*.py（P2-3）；逐文件隔离避免 Windows 上同进程
      # 偶发硬崩溃。依赖真实券商连接/需特意排除的用例，应在 tests/conftest.py 里以
      # `pytest.mark.broker` 标记，并在此处追加到 BROKER_TESTS 排除清单中说明。
      - name: Run backend tests (per-file, auto-discover)
        run: |
          fail=0
          # 明确需要真实券商账号/客户端的文件（默认无，均为自包含单测）。
          # 如需排除：把文件名（不含 .py）加入此空格分隔清单。
          BROKER_TESTS=""
          for f in tests/test_*.py; do
            name=$(basename "$f" .py)
            case " $BROKER_TESTS " in
              *" $name "*) echo "::group::$name (skipped: broker-dependent)"; echo "::endgroup::"; continue ;;
            esac
            echo "::group::$name"
            python -m pytest "$f" -q -p no:cacheprovider || fail=1
            echo "::endgroup::"
          done
          exit $fail

      # 数字核对：后端测试数 / 前端组件数 必须与方案文档一致，防止“改代码不更文档”
      - name: Reconcile numbers (tests / components vs docs)
        run: python ../scripts/ci_reconcile.py

      # G12-6 门禁补齐：许可扫描（G0-4）/ 能力漂移（G3-5）
      - name: License gate (AGPL/GPL zero-tolerance)
        run: python scripts/check_licenses.py
      - name: Capability drift gate (REST agent-visible -> MCP tool)
        run: python scripts/check_capability_drift.py
      # ★ R19 第 1 轮补齐：以下三条门禁此前**不在 CI 上**，只能靠人记得本地跑。
      #   本项目已两次栽在这上面（TD-29 / Gate 1 常驻红数月）：
      #   「没接在 CI 上的门禁会腐烂」—— 冻结基线会悄悄过期，红灯无人看见。
      - name: AppContext convergence gate (frozen baseline, no new direct `state` imports)
        run: python scripts/check_appcontext.py
      - name: BigQMT agent py3.6 compatibility gate
        run: python ../scripts/check_bigqmt_agent_py36.py
      - name: Capability coverage gate (every backend capability has an entry point or a registered exemption)
        run: python ../scripts/check_capability_coverage.py
      - name: API contract drift gate (frontend calls -> backend REST, path + query params)
        run: python ../scripts/check_api_contract_drift.py
      - name: WS consumption gate (backend emitted -> frontend registered)
        run: python ../scripts/check_ws_consumption.py

      - name: Execution architecture gate
        run: python ../scripts/check_execution_architecture.py

      # ★ R25 补齐：以下三条同属「没接在 CI 上的门禁会腐烂」家族。
      #   doc-links 抓「注释/文档指向已删除的文件」（读者按图索骥找不到）；
      #   unbounded-waits 抓「无出口循环 / 无超时等待」（死循环与冻机退出的静态形态）；
      #   orphan-modules 抓「零引用模块」（模块还在、引用早没了，只会持续腐化）。
      - name: Doc link gate (repo-relative path references resolve)
        run: python ../scripts/audit_doc_links.py
      # ★ 2026-10-09 新增：audit_doc_links 只管「文件在不在」，管不了
      #   「文档里写了一个**从未存在**的接口路径」。BROKER_ONBOARDING 的
      #   `profiles/hotplug` 就是这么挂了很久 —— 读者按文档调用只会 404。
      - name: Doc endpoint gate (every REST path written in docs exists in the contract)
        run: python ../scripts/check_doc_endpoint_links.py
      - name: Unbounded wait gate (no-exit loops / timeout-less loops)
        run: python ../scripts/check_unbounded_waits.py
      - name: Orphan module gate (modules with no import and no path reference)
        run: python scripts/audit_orphan_modules.py

      # ★ R26 补齐：后端有 orphan-modules，前端一直没有对应物 —— 于是
      #   「导出了没人用」只能靠人肉审计发现（R26 一次就扫出 9 个，含真漏接
      #   fmtSigned 与说谎的 docstring）。这一条把前端孤儿导出也纳入 CI。
      - name: Frontend orphan export gate (src exports with no consumer, incl. tests)
        run: python ../scripts/check_frontend_orphans.py

  lint:
    name: Lint (ruff — real-bug gate)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff==0.16.3

      # 仅检查真实 bug（F + E9），F401 未用导入因 re-export 转发模式故意排除
      - name: Ruff check
        run: ruff check .

  frontend-build:
    name: Frontend build (vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-next
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend-next/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      # C3/P2-3：前端门禁扩面 —— vitest 纯函数单测 + 类型门禁。
      # 旧 frontend/ 已退役：frontend-next 无 ESLint，类型门禁由 tsc --noEmit 承担
      # （strict + noUnusedLocals/Parameters + noUncheckedIndexedAccess）。
      - name: Frontend typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: Frontend unit tests (vitest)
        run: npm test

      - name: Build frontend
        run: npm run build
