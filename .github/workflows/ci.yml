name: CI

on:
  push:
    branches: [main]
  pull_request:

# 取消同一分支上正在运行的旧流水线，节省资源
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 自动发现 tests/test_*.py 全部测试文件、逐文件运行：自动纳入新增测试，
      # 避免硬编码清单漏掉 test_*.py（P2-3）；逐文件隔离避免 Windows 上同进程
      # 偶发硬崩溃。依赖真实券商连接/需特意排除的用例，应在 tests/conftest.py 里以
      # `pytest.mark.broker` 标记，并在此处追加到 BROKER_TESTS 排除清单中说明。
      - name: Run backend tests (per-file, auto-discover)
        run: |
          fail=0
          # 明确需要真实券商账号/客户端的文件（默认无，均为自包含单测）。
          # 如需排除：把文件名（不含 .py）加入此空格分隔清单。
          BROKER_TESTS=""
          for f in tests/test_*.py; do
            name=$(basename "$f" .py)
            case " $BROKER_TESTS " in
              *" $name "*) echo "::group::$name (skipped: broker-dependent)"; echo "::endgroup::"; continue ;;
            esac
            echo "::group::$name"
            python -m pytest "$f" -q -p no:cacheprovider || fail=1
            echo "::endgroup::"
          done
          exit $fail

      # 数字核对：后端测试数 / 前端组件数 必须与方案文档一致，防止“改代码不更文档”
      - name: Reconcile numbers (tests / components vs docs)
        run: python ../scripts/ci_reconcile.py

      # G12-6 门禁补齐：许可扫描（G0-4）/ 能力漂移（G3-5）/ 前端 className 差集（G11-6）
      - name: License gate (AGPL/GPL zero-tolerance)
        run: python scripts/check_licenses.py
      - name: Capability drift gate (REST agent-visible -> MCP tool)
        run: python scripts/check_capability_drift.py
      - name: Frontend className diff gate
        run: python scripts/check_frontend_classnames.py

  lint:
    name: Lint (ruff — real-bug gate)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff==0.16.3

      # 仅检查真实 bug（F + E9），F401 未用导入因 re-export 转发模式故意排除
      - name: Ruff check
        run: ruff check .

  frontend-build:
    name: Frontend build (vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      # C3/P2-3：前端门禁扩面 —— ESLint（no-undef/no-shadow/react-hooks）+ vitest 纯函数单测。
      # 与后端 ruff 一致：只拦真实 bug（漏导入/命名遮蔽/hooks 误用），不搞风格洁癖。
      - name: Frontend lint (eslint)
        run: npm run lint

      - name: Frontend unit tests (vitest)
        run: npm test

      - name: Build frontend
        run: npm run build
