# Electron 打包配置。
# 渲染进程通过 URL 加载 FastAPI 托管的前端，无需把前端打包进 asar；
# Python 后端由 PyInstaller 打成 qmt_work.exe，作为 extraResources 随包分发。
#
# 产物：
#   - NSIS 安装包（默认，覆盖普通用户）
#   - zip 便携版（--win zip）
#
# 代码签名（可选但强烈建议）：
#   设置环境变量后 electron-builder 自动签名（同时生成 latest.yml 供自动更新）：
#     Windows:  CSC_LINK=<pfx路径> CSC_KEY_PASSWORD=<密码>
#     macOS:    CSC_LINK=<p12路径> CSC_KEY_PASSWORD=<密码> (需在 macOS 上构建)
#   未配置时跳过签名（SmartScreen 可能告警）。
#
# 自动更新：electron-updater 从 publish.url 拉取 latest.yml + 安装包。
#   默认 GitHub Releases（GitHub Token: GH_TOKEN）。自建服务器改 serverUrl。
appId: com.qmt.work
productName: qmt_work
copyright: Copyright © 2026
directories:
  output: dist-electron
  buildResources: build
files:
  - "electron/**/*"
  - "package.json"
extraResources:
  - from: ../backend/dist
    to: backend
win:
  signAndEditExecutable: true
  target:
    - nsis
    - zip
  artifactName: ${productName}-${version}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: qmt_work
  artifactName: ${productName}-Setup-${version}.${ext}
publish:
  - provider: generic
    # 支持未设置环境变量时使用默认更新地址（electron-builder 的 :- 默认值语法），
    # 使 npm run dist:portable 开箱可用；设置 QMT_UPDATE_URL 仍可覆盖。
    url: ${env.QMT_UPDATE_URL:-https://github.com/qmt-work/qmt_work/releases/download}
