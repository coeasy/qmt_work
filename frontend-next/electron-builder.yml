# Electron 打包配置。
# 渲染进程通过 URL 加载 FastAPI 托管的前端，无需把前端打包进 asar；
# Python 后端由 PyInstaller 打成 qmt_work.exe，作为 extraResources 随包分发。
#
# 产物：
#   - NSIS 安装包（默认，覆盖普通用户）
#   - zip 便携版（--win zip）
#
# 代码签名（可选但强烈建议）：
#   设置环境变量后 electron-builder 自动签名（同时生成 latest.yml 供自动更新）：
#     Windows:  CSC_LINK=<pfx路径> CSC_KEY_PASSWORD=<密码>
#     macOS:    CSC_LINK=<p12路径> CSC_KEY_PASSWORD=<密码> (需在 macOS 上构建)
#   未配置时跳过签名（SmartScreen 可能告警）。
#
# 自动更新：electron-updater 从 publish.url 拉取 latest.yml + 安装包。
#   默认 GitHub Releases（GitHub Token: GH_TOKEN）。自建服务器改 serverUrl。
appId: com.qmt.work
productName: qmt_work
copyright: Copyright © 2026
directories:
  output: dist-electron
  buildResources: build
files:
  - "electron/**/*"
  - "package.json"
  # ★★ 托盘图标必须**打进 asar**（2026-09-22 修的真缺陷）。
  # 主进程托盘用 `path.join(__dirname, "..", "build", "icon.png")` 定位它，
  # 而 `__dirname` 在打包态是 `resources/app.asar/electron` ⇒ 目标是
  # `resources/app.asar/build/icon.png`。此前 `files` 只有 electron/** 与 package.json，
  # 该文件**没进包**（实测 asar 1531 条里 `build/` 与 `icon.*` 命中 0 条）
  # ⇒ `existsSync` 恒 false ⇒ 托盘不创建 ⇒ 关闭窗口后**再也退不出去**。
  # ⚠️ `directories.buildResources: build` 只决定「安装包/EXE 用哪个图标」，
  #    **不会**把它塞进 asar —— 这两件事必须分开配。
  - "build/icon.png"
extraResources:
  - from: ../backend/dist
    to: backend
  # 托盘图标的第二条独立路径（`process.resourcesPath/build/icon.png`）：
  # 与 asar 内那份互为冗余，任何一条可用即可建起托盘。
  - from: build/icon.png
    to: build/icon.png
win:
  signAndEditExecutable: true
  target:
    - nsis
    - zip
  artifactName: ${productName}-${version}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: qmt_work
  artifactName: ${productName}-Setup-${version}.${ext}
publish:
  # GitHub Releases 自动更新源（electron-updater 据此拉取 latest.yml + 安装包）。
  # -p always 时 electron-builder 自动把产物上传到对应 Release。
  # 注意：App 内自动更新仅对【公开】仓库默认可用；私有仓库需换自建更新服务器。
  - provider: github
    owner: coeasy
    repo: qmt_work
