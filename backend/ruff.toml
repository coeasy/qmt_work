# QMT Work — ruff 配置（G12-1 收紧版）
#
# 质量门禁目标：捕获真实 bug，且不因存量 565 文件大规模重构引发回归。
# 规则集：F（pyflakes 全集）+ E（pycodestyle 基础）+ I（导入排序）+ B（bugbear）+
#         S（bandit 基础，防敏感 API 误用）。
#
# 豁免说明：
# - F401：`from X import Y` 的转发 re-export 模式（误判为未使用），项目约定保留。
# - E501/E702：行宽/分号纯风格，不阻断；后续格式化统一处理。
# - S101：assert 在测试中为正常断言；生产代码中的 assert 另由 B011 关注。
# - S110/S112：try-except-pass/continue 在容错降级路径中为显式意图（配合
#   `# noqa: S110` 标注关键位置），不全局阻断。
# - S608：SQL 拼接在 db.py 迁移/动态查询为受控输入，配合参数化查询使用。
# - B905：zip 缺 strict 属语义增强，存量代码行为依赖省略，暂不强制。
# - per-file-ignores：测试/探针/网络抓取/子进程启动等合法模式豁免。
line-length = 120
target-version = "py311"

[lint]
select = ["F", "E", "I", "B", "S"]
ignore = ["F401", "E501", "E702", "S101", "S110", "S112", "S608", "B905"]

[lint.per-file-ignores]
# 测试断言与探针脚本：合法使用 assert / 歧义变量 / 随机数 / 子进程 / 明文凭据
"tests/*" = ["S310", "S311", "S603", "S607", "S105", "B011", "B017", "E741", "B023", "B007"]
"tests/probes/*" = ["S310", "S311", "S603", "S607", "S105", "B011", "B017", "E741"]
# 券商客户端启动器：拉起外部进程是核心能力（受控参数、无 shell）
"xtquant_client/*" = ["S603", "S607", "S310", "S105"]
# 网关/桥接/运行时：外部命令与网络是业务本质
"gateway/*" = ["S603", "S607", "S310"]
"bridge/*" = ["S603", "S607", "S310"]
# 配置/凭据管理：密文仅用于本地配置读写（crypto 层）
"app/crypto.py" = ["S105"]
"tools/fetch_runtimes.py" = ["S310", "S311"]
